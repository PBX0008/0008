<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Responsive Space Lightbulb</title>
    <!-- Cursive script font matching the photo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #74b9ff; /* Light Blue */
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Caveat', cursive;
        }

        /* Container keeping graphic centered and fully visible */
        .svg-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg {
            width: 100%;
            height: 100%;
            max-height: 90vh;
            object-fit: contain;
        }

        .white-stroke {
            stroke: #FFFFFF;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .script-text {
            font-family: 'Caveat', cursive;
            fill: #FFFFFF;
            font-size: 28px; /* Slightly reduced font size for mobile clearance */
            text-anchor: middle;
            dominant-baseline: middle;
            user-select: none;
        }

        .script-text-lg {
            font-size: 32px;
        }

        /* Floating motion styling */
        .floating-group {
            will-change: transform;
        }
    </style>
</head>
<body>

    <div class="svg-container">
        <!-- SVG viewBox centered and wide enough to prevent crowding -->
        <svg viewBox="0 0 600 850" xmlns="http://www.w3.org/2000/svg">
            
            <!-- ================= STATIC LIGHTBULB ================= -->
            <!-- Rays -->
            <g class="white-stroke" stroke-width="12">
                <line x1="140" y1="210" x2="100" y2="175" />
                <line x1="225" y1="135" x2="200" y2="80" />
                <line x1="300" y1="110" x2="300" y2="50" />
                <line x1="375" y1="135" x2="400" y2="80" />
                <line x1="460" y1="210" x2="500" y2="175" />
                <line x1="490" y1="305" x2="540" y2="305" />
                <line x1="470" y1="400" x2="520" y2="425" />
                <line x1="110" y1="305" x2="60"  y2="305" />
                <line x1="130" y1="400" x2="80"  y2="425" />
            </g>

            <!-- Bulb Glass Frame -->
            <path d="M 200,490 
                     C 110,460 90,300 190,200 
                     C 250,140 350,140 410,200 
                     C 510,300 490,460 400,490" 
                  class="white-stroke" stroke-width="12" />

            <!-- Filament Lines -->
            <path d="M 250,490 L 285,350 M 350,490 L 315,350" class="white-stroke" stroke-width="7" />
            
            <!-- Filament Loops -->
            <path d="M 285,350 
                     C 268,300 278,280 290,290 
                     C 302,300 285,350 300,350 
                     C 315,350 298,300 310,290 
                     C 322,280 332,300 315,350" 
                  class="white-stroke" stroke-width="7" />

            <!-- Base Threads -->
            <g class="white-stroke" stroke-width="10">
                <line x1="225" y1="515" x2="375" y2="515" />
                <line x1="225" y1="540" x2="375" y2="540" />
                <line x1="225" y1="565" x2="375" y2="565" />
            </g>

            <!-- Base Cap -->
            <path d="M 235,585 C 235,630 365,630 365,585 Z" fill="#FFFFFF" />


            <!-- ================= CLEARANCE-ADJUSTED FLOATING TEXT & ARROWS ================= -->
            
            <!-- 1. "enlighten" (Top Right Outside) -->
            <g class="floating-group" data-dx="6" data-dy="6" data-speed="0.0006">
                <text x="480" y="70" class="script-text script-text-lg">enlighten</text>
                <path d="M 430,80 C 420,90 415,95 410,105" class="white-stroke" stroke-width="3.5" />
                <path d="M 410,105 L 418,100 M 410,105 L 413,95" class="white-stroke" stroke-width="3.5" />
            </g>

            <!-- 2. "aspire" (Inside Left - Clears Wall and Filament) -->
            <g class="floating-group" data-dx="5" data-dy="5" data-speed="0.0008">
                <text x="210" y="270" class="script-text">aspire</text>
                <path d="M 220,285 C 230,295 238,300 245,305" class="white-stroke" stroke-width="3.5" />
                <path d="M 245,305 L 236,303 M 245,305 L 241,296" class="white-stroke" stroke-width="3.5" />
            </g>

            <!-- 3. "achieve" (Inside Top - Centered High Above Loops) -->
            <g class="floating-group" data-dx="4" data-dy="6" data-speed="0.0005">
                <text x="300" y="200" class="script-text">achieve</text>
                <path d="M 300,215 L 300,235" class="white-stroke" stroke-width="3.5" />
                <path d="M 300,235 L 294,226 M 300,235 L 306,226" class="white-stroke" stroke-width="3.5" />
            </g>

            <!-- 4. "grow" (Inside Right - Clears Wall and Filament) -->
            <g class="floating-group" data-dx="5" data-dy="5" data-speed="0.0007">
                <text x="390" y="290" class="script-text">grow</text>
                <path d="M 378,305 C 368,318 360,323 355,327" class="white-stroke" stroke-width="3.5" />
                <path d="M 355,327 L 364,325 M 355,327 L 358,317" class="white-stroke" stroke-width="3.5" />
            </g>

            <!-- 5. "employees" (Bottom Right Outside) -->
            <g class="floating-group" data-dx="6" data-dy="5" data-speed="0.0006">
                <text x="475" y="650" class="script-text script-text-lg">employees</text>
                <path d="M 380,605 C 395,620 405,628 412,633" class="white-stroke" stroke-width="3.5" />
                <path d="M 412,633 L 402,631 M 412,633 L 406,624" class="white-stroke" stroke-width="3.5" />
            </g>

        </svg>
    </div>

    <!-- ZERO-G MOTION SCRIPT -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const floatGroups = document.querySelectorAll('.floating-group');

            floatGroups.forEach((group, index) => {
                const maxDx = parseFloat(group.getAttribute('data-dx')) || 5;
                const maxDy = parseFloat(group.getAttribute('data-dy')) || 5;
                const speed = parseFloat(group.getAttribute('data-speed')) || 0.0006;
                const phase = index * 1.5;

                function animate(time) {
                    const t = time * speed + phase;
                    
                    // Tight float animation preventing any collisions
                    const translateX = Math.sin(t) * maxDx;
                    const translateY = Math.cos(t * 0.85) * maxDy;
                    const rotate = Math.sin(t * 0.5) * 2;

                    group.setAttribute('transform', `translate(${translateX}, ${translateY}) rotate(${rotate})`);
                    
                    requestAnimationFrame(animate);
                }
                
                requestAnimationFrame(animate);
            });
        });
    </script>

</body>
</html>
