<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Responsive Space Lightbulb</title>
    <!-- Cursive script font matching the photo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #74b9ff; /* Light Blue */
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Caveat', cursive;
        }

        /* SVG scale container ensuring perfect fit on all mobile screens */
        .svg-container {
            width: 100vw;
            height: 100vh;
            max-width: 100%;
            max-height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg {
            width: 100%;
            height: 100%;
            max-height: 95vh;
            object-fit: contain;
        }

        .white-stroke {
            stroke: #FFFFFF;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .script-text {
            font-family: 'Caveat', cursive;
            fill: #FFFFFF;
            font-size: 34px;
            text-anchor: middle;
            dominant-baseline: middle;
            user-select: none;
        }

        /* Floating motion class */
        .floating-group {
            will-change: transform;
        }
    </style>
</head>
<body>

    <div class="svg-container">
        <!-- Main viewBox designed for portrait mobile layout -->
        <svg viewBox="0 0 600 850" xmlns="http://www.w3.org/2000/svg">
            
            <!-- ================= STATIC LIGHTBULB (CENTERED) ================= -->
            <!-- Bulb Rays -->
            <g class="white-stroke" stroke-width="12">
                <line x1="140" y1="210" x2="100" y2="175" />
                <line x1="225" y1="135" x2="200" y2="80" />
                <line x1="300" y1="110" x2="300" y2="50" />
                <line x1="375" y1="135" x2="400" y2="80" />
                <line x1="460" y1="210" x2="500" y2="175" />
                <line x1="490" y1="305" x2="540" y2="305" />
                <line x1="470" y1="400" x2="520" y2="425" />
                <line x1="110" y1="305" x2="60"  y2="305" />
                <line x1="130" y1="400" x2="80"  y2="425" />
            </g>

            <!-- Bulb Glass Frame -->
            <path d="M 200,490 
                     C 110,460 90,300 190,200 
                     C 250,140 350,140 410,200 
                     C 510,300 490,460 400,490" 
                  class="white-stroke" stroke-width="12" />

            <!-- Filament Inner Lines -->
            <path d="M 250,490 L 285,330 M 350,490 L 315,330" class="white-stroke" stroke-width="7" />
            
            <!-- Filament Loops -->
            <path d="M 285,330 
                     C 268,280 278,260 290,270 
                     C 302,280 285,330 300,330 
                     C 315,330 298,280 310,270 
                     C 322,260 332,280 315,330" 
                  class="white-stroke" stroke-width="7" />

            <!-- Base Threads -->
            <g class="white-stroke" stroke-width="10">
                <line x1="225" y1="515" x2="375" y2="515" />
                <line x1="225" y1="540" x2="375" y2="540" />
                <line x1="225" y1="565" x2="375" y2="565" />
            </g>

            <!-- Bottom Base Cap -->
            <path d="M 235,585 C 235,630 365,630 365,585 Z" fill="#FFFFFF" />


            <!-- ================= FLOATING TEXT & ARROWS ================= -->
            
            <!-- 1. "enlighten" (Top Right) -->
            <g class="floating-group" data-dx="15" data-dy="12" data-speed="0.0006">
                <text x="490" y="80" class="script-text">enlighten</text>
                <path d="M 445,90 C 435,100 430,105 425,115" class="white-stroke" stroke-width="4" />
                <path d="M 425,115 L 433,110 M 425,115 L 428,105" class="white-stroke" stroke-width="4" />
            </g>

            <!-- 2. "aspire" (Inside Left) -->
            <g class="floating-group" data-dx="12" data-dy="10" data-speed="0.0008">
                <text x="180" y="280" class="script-text">aspire</text>
                <path d="M 195,300 C 210,315 220,320 230,325" class="white-stroke" stroke-width="4" />
                <path d="M 230,325 L 220,323 M 230,325 L 227,315" class="white-stroke" stroke-width="4" />
            </g>

            <!-- 3. "achieve" (Inside Top) -->
            <g class="floating-group" data-dx="10" data-dy="14" data-speed="0.0005">
                <text x="300" y="215" class="script-text">achieve</text>
                <path d="M 300,232 L 300,255" class="white-stroke" stroke-width="4" />
                <path d="M 300,255 L 293,245 M 300,255 L 307,245" class="white-stroke" stroke-width="4" />
            </g>

            <!-- 4. "grow" (Inside Right) -->
            <g class="floating-group" data-dx="12" data-dy="12" data-speed="0.0007">
                <text x="410" y="300" class="script-text">grow</text>
                <path d="M 395,320 C 380,335 370,340 363,345" class="white-stroke" stroke-width="4" />
                <path d="M 363,345 L 373,345 M 363,345 L 367,335" class="white-stroke" stroke-width="4" />
            </g>

            <!-- 5. "employees" (Bottom Right) -->
            <g class="floating-group" data-dx="14" data-dy="10" data-speed="0.0006">
                <text x="480" y="630" class="script-text">employees</text>
                <path d="M 375,600 C 395,620 405,625 415,630" class="white-stroke" stroke-width="4" />
                <path d="M 415,630 L 405,628 M 415,630 L 408,620" class="white-stroke" stroke-width="4" />
            </g>

        </svg>
    </div>

    <!-- SMOOTH ZERO-G MOTION SCRIPT -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const floatGroups = document.querySelectorAll('.floating-group');

            floatGroups.forEach((group, index) => {
                const maxDx = parseFloat(group.getAttribute('data-dx')) || 12;
                const maxDy = parseFloat(group.getAttribute('data-dy')) || 12;
                const speed = parseFloat(group.getAttribute('data-speed')) || 0.0006;
                const phase = index * 1.5; // Offset start times for independent floating

                function animate(time) {
                    const t = time * speed + phase;
                    
                    // Controlled zero-g floating motion without overlapping bulb paths
                    const translateX = Math.sin(t) * maxDx;
                    const translateY = Math.cos(t * 0.85) * maxDy;
                    const rotate = Math.sin(t * 0.5) * 4; // Very subtle tilt

                    group.setAttribute('transform', `translate(${translateX}, ${translateY}) rotate(${rotate})`);
                    
                    requestAnimationFrame(animate);
                }
                
                requestAnimationFrame(animate);
            });
        });
    </script>

</body>
</html>
