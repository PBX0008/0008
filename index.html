<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightbulb Graphic</title>
    <!-- Google Font matching the cursive script in the image -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Background changed to Light Blue as requested */
            background-color: #87CEEB; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Caveat', cursive;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        svg {
            width: 100%;
            height: auto;
        }

        /* Text Styles */
        .script-text {
            font-family: 'Caveat', cursive;
            fill: #FFFFFF;
            font-size: 38px;
            text-anchor: middle;
            dominant-baseline: middle;
        }

        /* SVG Line Styles */
        .white-stroke {
            stroke: #FFFFFF;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>
<body>

    <div class="container">
        <svg viewBox="0 0 500 700" xmlns="http://www.w3.org/2000/svg">
            
            <!-- ================= LIGHTBULB RAYS ================= -->
            <g class="white-stroke" stroke-width="12">
                <!-- Top-left rays -->
                <line x1="140" y1="190" x2="100" y2="155" />
                <line x1="225" y1="115" x2="200" y2="60" />
                
                <!-- Top ray -->
                <line x1="318" y1="90"  x2="318" y2="30" />
                
                <!-- Top-right rays -->
                <line x1="410" y1="115" x2="435" y2="60" />
                <line x1="495" y1="190" x2="535" y2="155" />
                
                <!-- Middle-right rays -->
                <line x1="525" y1="285" x2="575" y2="285" />
                <line x1="505" y1="380" x2="555" y2="400" />
            </g>

            <!-- Left middle ray -->
            <line x1="110" y1="285" x2="60" y2="285" class="white-stroke" stroke-width="12" />
            <line x1="130" y1="380" x2="80" y2="405" class="white-stroke" stroke-width="12" />

            <!-- ================= LIGHTBULB OUTLINE ================= -->
            <!-- Glass Outline -->
            <path d="M 210,470 
                     C 120,440 100,280 200,180 
                     C 270,110 365,110 435,180 
                     C 535,280 515,440 425,470" 
                  class="white-stroke" stroke-width="12" />

            <!-- Filament Inner Lines -->
            <path d="M 260,470 L 300,310 M 375,470 L 335,310" class="white-stroke" stroke-width="7" />
            
            <!-- Filament Loops -->
            <path d="M 300,310 
                     C 280,260 290,240 305,250 
                     C 320,260 300,310 315,310 
                     C 330,310 310,260 325,250 
                     C 340,240 350,260 335,310" 
                  class="white-stroke" stroke-width="7" />

            <!-- Screw Base (Bulb Base) -->
            <g class="white-stroke" stroke-width="10">
                <line x1="240" y1="495" x2="395" y2="495" />
                <line x1="240" y1="520" x2="395" y2="520" />
                <line x1="240" y1="545" x2="395" y2="545" />
            </g>

            <!-- Bottom Contact Cap -->
            <path d="M 250,565 C 250,610 385,610 385,565 Z" fill="#FFFFFF" />

            <!-- ================= TEXT & ARROWS ================= -->

            <!-- 1. "enlighten" (Top Right) -->
            <text x="530" y="70" class="script-text">enlighten</text>
            <!-- Curved Arrow pointing down-left -->
            <path d="M 480,75 C 470,85 465,85 460,95" class="white-stroke" stroke-width="4" />
            <path d="M 460,95 L 468,90 M 460,95 L 463,85" class="white-stroke" stroke-width="4" />

            <!-- 2. "aspire" (Inside Left) -->
            <text x="210" y="275" class="script-text">aspire</text>
            <!-- Arrow pointing down-right -->
            <path d="M 225,295 C 240,310 250,315 260,320" class="white-stroke" stroke-width="4" />
            <path d="M 260,320 L 250,318 M 260,320 L 257,310" class="white-stroke" stroke-width="4" />

            <!-- 3. "achieve" (Inside Top) -->
            <text x="335" y="240" class="script-text">achieve</text>
            <!-- Arrow pointing down -->
            <path d="M 335,260 L 335,285" class="white-stroke" stroke-width="4" />
            <path d="M 335,285 L 328,275 M 335,285 L 342,275" class="white-stroke" stroke-width="4" />

            <!-- 4. "grow" (Inside Right) -->
            <text x="430" y="295" class="script-text">grow</text>
            <!-- Arrow pointing down-left -->
            <path d="M 420,315 C 405,330 395,335 388,340" class="white-stroke" stroke-width="4" />
            <path d="M 388,340 L 398,340 M 388,340 L 392,330" class="white-stroke" stroke-width="4" />

            <!-- 5. "employees" (Bottom Right) -->
            <text x="515" y="605" class="script-text">employees</text>
            <!-- Arrow pointing from bottom-left to text -->
            <path d="M 395,580 C 415,600 425,605 435,610" class="white-stroke" stroke-width="4" />
            <path d="M 435,610 L 425,608 M 435,610 L 428,600" class="white-stroke" stroke-width="4" />

        </svg>
    </div>

</body>
</html>
